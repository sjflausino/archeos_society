services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./archeos.db
    volumes:
      - ./backend/app:/app/app
    # Garante que o FastAPI aceite conexões externas ao container
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 
